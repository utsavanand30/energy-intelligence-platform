services:
  - type: web
    name: energy-intelligence-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # upgrade to standard for production workloads
    region: singapore      # closest to India; change to oregon/frankfurt as needed
    branch: main
    healthCheckPath: /health
    envVars:
      - key: SERVE_FRONTEND
        value: "true"
      - key: SIMULATION_MODE
        value: realtime
      - key: SCAN_INTERVAL_SECONDS
        value: "30"
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: CORS_ORIGINS
        value: "https://energy-intelligence-platform.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: energy-db
          property: connectionString
    autoDeploy: true

databases:
  - name: energy-db
    databaseName: energy_db
    plan: starter             # 256 MB RAM, 1 GB storage — free tier
    region: singapore
